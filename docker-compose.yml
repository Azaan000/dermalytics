version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./dermalytics.db
      - ENVIRONMENT=production
      - SECRET_KEY=dermalytics-super-secure-production-key-2026
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/dermalytics.db:/app/dermalytics.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: dermalytics-network
