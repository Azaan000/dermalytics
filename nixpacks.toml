# Railway Nixpacks configuration for Python FastAPI
[phases.setup]
nixPkgs = ["python311", "stdenv.cc.lib", "glib"]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r backend/requirements.txt"
]

[start]
cmd = "/opt/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
